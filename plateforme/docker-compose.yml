# ============================================================
# Plateforme RecipeLog : tout tourne sur une seule machine avec Docker.
#
#   Cloudflare ──tunnel──> cloudflared ──> Traefik ──> un conteneur par client
#                                                 ├──> Authentik (auth.<domaine>) : comptes de tous les clients
#                                                 ├──> panel (admin.<domaine>), vitrine (<domaine>, www)
#                                                 └──> démo (demo.<domaine>) : un client comme les autres
#   passerelle : seule à détenir la clé d'Authentik ; les clients lui demandent
#                d'inviter ou de retirer leurs collaborateurs (connexion.md).
#   PostgreSQL : un seul serveur, une base par client.
#
# Lancé par install.sh avec :
#   docker compose --project-directory <ce dossier> --env-file /srv/recipelog/.env up -d
# Les clients ne sont PAS dans ce fichier : bin/recipelog-instance les crée
# (un conteneur chacun, sur le réseau « recipelog »).
# ============================================================
name: recipelog

networks:
  recipelog:
    name: recipelog
  socket:
    name: recipelog-socket
    internal: true # le proxy Docker n'est joignable que par Traefik
  # Le moteur (qui pilote Docker) n'est joignable que par le panel : les sites des
  # clients, sur le réseau « recipelog », ne peuvent pas lui parler.
  moteur:
    name: recipelog-moteur

services:
  # Accès à Docker limité : Traefik peut LIRE la liste des conteneurs, rien d'autre.
  socket-proxy:
    image: linuxserver/socket-proxy:3.4.7-r0-ls105
    container_name: recipelog-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
      LOG_LEVEL: warning
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks: [socket]

  # Aiguilleur : envoie chaque sous-domaine vers le bon conteneur.
  traefik:
    image: traefik:v3.6.4
    container_name: recipelog-traefik
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamique.yml:/etc/traefik/dynamique.yml:ro
    # Aucun port ouvert vers l'extérieur : seulement 127.0.0.1:8080 sur la
    # machine, pour tester avec curl. Les visiteurs arrivent par cloudflared.
    ports:
      - "127.0.0.1:8080:80"
    networks: [recipelog, socket]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Un seul PostgreSQL pour tous les clients (une base chacun).
  postgres:
    image: postgres:16-alpine
    container_name: recipelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans /srv/recipelog/.env}
      POSTGRES_DB: postgres
    # Chaque client a droit à 15 connexions au plus (recipelog-instance) : 300 laissent
    # de la place à une vingtaine de clients très actifs, à Authentik et aux sauvegardes.
    command: ["postgres", "-c", "max_connections=${POSTGRES_CONNEXIONS:-300}", "-c", "shared_buffers=${POSTGRES_MEMOIRE:-256MB}"]
    volumes:
      - ${DONNEES:-/srv/recipelog}/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    networks: [recipelog]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tunnel Cloudflare : relie la machine à Cloudflare sans ouvrir de port.
  # Démarré seulement si CF_TUNNEL_TOKEN est rempli (COMPOSE_PROFILES=tunnel).
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    container_name: recipelog-cloudflared
    restart: unless-stopped
    profiles: [tunnel]
    depends_on: [traefik]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    networks: [recipelog]

  # Comptes de tous les clients : email + mot de passe, mot de passe oublié,
  # Google, double authentification. Voir connexion.md.
  authentik:
    image: authentik/server:${AUTHENTIK_VERSION:-2025.10.2}
    container_name: recipelog-authentik
    restart: unless-stopped
    command: server
    depends_on:
      postgres:
        condition: service_healthy
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY manquant dans /srv/recipelog/.env}
      AUTHENTIK_POSTGRESQL__HOST: recipelog-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD manquant}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOTE:-localhost}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_UTILISATEUR:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_MOT_DE_PASSE:-}
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_TLS:-true}
      AUTHENTIK_EMAIL__FROM: ${SMTP_EXPEDITEUR:-RecipeLog <noreply@recipelog.cc>}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME: "false"
    volumes:
      - ${DONNEES:-/srv/recipelog}/authentik/media:/media
      # Polices et icône des pages de connexion (servies sous /media/recipelog/).
      - ./authentik/theme:/media/recipelog:ro
      - ./authentik/blueprints:/blueprints/custom:ro
      - ./authentik/templates:/templates:ro
    networks: [recipelog]
    # Authentik met 1 à 3 minutes à démarrer la première fois : pendant ce temps il est
    # « en démarrage », pas « en panne » (la surveillance et install.sh attendent).
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    labels:
      traefik.enable: "true"
      traefik.http.routers.authentik.rule: Host(`auth.${DOMAINE:-recipelog.cc}`)
      traefik.http.routers.authentik.entrypoints: web
      traefik.http.routers.authentik.middlewares: securite@file,limite@file
      # Les étapes de connexion (mot de passe, code) : limite plus stricte par adresse,
      # contre les essais de mots de passe en rafale.
      traefik.http.routers.authentik-connexion.rule: Host(`auth.${DOMAINE:-recipelog.cc}`) && PathPrefix(`/api/v3/flows/executor/`)
      traefik.http.routers.authentik-connexion.entrypoints: web
      traefik.http.routers.authentik-connexion.middlewares: securite@file,limite-connexion@file
      traefik.http.routers.authentik-connexion.service: authentik
      traefik.http.services.authentik.loadbalancer.server.port: "9000"

  authentik-worker:
    image: authentik/server:${AUTHENTIK_VERSION:-2025.10.2}
    container_name: recipelog-authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment: *authentik-env
    volumes:
      - ${DONNEES:-/srv/recipelog}/authentik/media:/media
      # Polices et icône des pages de connexion (servies sous /media/recipelog/).
      - ./authentik/theme:/media/recipelog:ro
      - ./authentik/blueprints:/blueprints/custom:ro
      - ./authentik/templates:/templates:ro
    networks: [recipelog]

  # Seule à détenir la clé d'Authentik. Les clients l'appellent sur le réseau
  # Docker (jamais publiée par Traefik), chacun avec sa propre clé.
  passerelle:
    build: ./passerelle
    image: recipelog-passerelle:local
    container_name: recipelog-passerelle
    restart: unless-stopped
    depends_on: [authentik]
    environment:
      AUTHENTIK_URL: http://recipelog-authentik:9000
      AUTHENTIK_PUBLIC: https://auth.${DOMAINE:-recipelog.cc}
      AUTHENTIK_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?AUTHENTIK_BOOTSTRAP_TOKEN manquant}
      DOMAINE: ${DOMAINE:-recipelog.cc}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Lecture des factures par IA (lot 7) : clé Anthropic de la plateforme (vide = pas d'IA fournie)
      # et nombre de lectures par mois quand le panel n'a rien réglé pour un client.
      IA_ANTHROPIC_CLE: ${IA_ANTHROPIC_CLE:-}
      IA_QUOTA_DEFAUT: ${IA_QUOTA_DEFAUT:-30}
    read_only: true
    volumes:
      # Lectures par IA (lot 7) : quotas écrits par le panel, compteurs écrits par la passerelle.
      - ${DONNEES:-/srv/recipelog}/ia:/ia
      # Demandes « Signaler un problème » (lot 5), lues aussi par le moteur du panel.
      - ${DONNEES:-/srv/recipelog}/support:/support
      # Maintenance et bandeaux (lot 6), écrits par le moteur.
      - ${DONNEES:-/srv/recipelog}/annonces:/annonces:ro
    networks: [recipelog]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  # Panel admin (admin.<domaine>), réservé aux super-admins. Il n'a aucun accès à
  # Docker : il demande tout au moteur. Il sert aussi la page « site en pause »
  # pour les adresses *.<domaine> qui n'ont pas de RecipeLog en ligne.
  panel:
    build:
      context: ..
      dockerfile: plateforme/panel/Dockerfile
    image: recipelog-panel:local
    container_name: recipelog-panel
    restart: unless-stopped
    user: node
    read_only: true
    depends_on: [moteur]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    environment:
      DOMAINE: ${DOMAINE:-recipelog.cc}
      PANEL_URL: https://admin.${DOMAINE:-recipelog.cc}
      PANEL_OIDC_ISSUER: ${PANEL_OIDC_ISSUER:-}
      PANEL_OIDC_CLIENT_ID: ${PANEL_OIDC_CLIENT_ID:-}
      PANEL_OIDC_CLIENT_SECRET: ${PANEL_OIDC_CLIENT_SECRET:-}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:-}
      # Bouton « Se connecter » du site vitrine (<domaine>/connexion) : install.sh les écrit.
      PORTAIL_OIDC_ISSUER: ${PORTAIL_OIDC_ISSUER:-}
      PORTAIL_OIDC_CLIENT_ID: ${PORTAIL_OIDC_CLIENT_ID:-}
      PORTAIL_OIDC_CLIENT_SECRET: ${PORTAIL_OIDC_CLIENT_SECRET:-}
      OIDC_INTERNE: http://recipelog-authentik:9000
      MOTEUR_URL: http://recipelog-moteur:8000
      MOTEUR_CLE: ${MOTEUR_CLE:-}
    networks: [recipelog, moteur]
    labels:
      traefik.enable: "true"
      traefik.http.routers.panel.rule: Host(`admin.${DOMAINE:-recipelog.cc}`)
      traefik.http.routers.panel.entrypoints: web
      traefik.http.routers.panel.middlewares: securite@file,limite@file
      traefik.http.routers.panel.service: panel
      # Toute autre adresse *.<domaine> sans RecipeLog en ligne (en pause, en
      # train de redémarrer, inconnue) : priorité la plus basse.
      # Page de statut publique (lot 5), sans connexion.
      traefik.http.routers.statut.rule: Host(`status.${DOMAINE:-recipelog.cc}`)
      traefik.http.routers.statut.entrypoints: web
      traefik.http.routers.statut.middlewares: securite@file,limite@file
      traefik.http.routers.statut.service: panel
      # Tarifs et textes légaux (lot 8), et le bouton « Se connecter » (/connexion) : ces adresses du site vitrine sont servies par le panel,
      # avec leur feuille de style sous /_plateforme/ (admin.<domaine> peut donc être fermé
      # par Cloudflare Access sans casser ces pages).
      traefik.http.routers.vente.rule: (Host(`${DOMAINE:-recipelog.cc}`) || Host(`www.${DOMAINE:-recipelog.cc}`)) && (Path(`/tarifs`) || Path(`/mentions-legales`) || Path(`/cgv`) || Path(`/confidentialite`) || Path(`/sous-traitance`) || Path(`/connexion`) || Path(`/connexion/retour`) || PathPrefix(`/_plateforme/`))
      traefik.http.routers.vente.priority: "200"
      traefik.http.routers.vente.entrypoints: web
      traefik.http.routers.vente.middlewares: securite@file,limite@file
      traefik.http.routers.vente.service: panel
      traefik.http.routers.pause.rule: HostRegexp(`^[a-z0-9-]+\.${DOMAINE_REGEX:-recipelog\.cc}$`)
      traefik.http.routers.pause.priority: "1"
      traefik.http.routers.pause.entrypoints: web
      traefik.http.routers.pause.middlewares: securite@file,limite@file
      traefik.http.routers.pause.service: panel
      traefik.http.services.panel.loadbalancer.server.port: "3000"

  # Le moteur du panel : le seul à piloter Docker (il lance recipelog-instance).
  # Jamais publié par Traefik ; le panel l'appelle avec MOTEUR_CLE.
  moteur:
    build:
      context: ..
      dockerfile: plateforme/panel/Dockerfile
    image: recipelog-panel:local
    container_name: recipelog-moteur
    restart: unless-stopped
    command: ["node", "moteur.mjs"]
    depends_on: [passerelle]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    environment:
      DONNEES: ${DONNEES:-/srv/recipelog}
      MOTEUR_CLE: ${MOTEUR_CLE:?MOTEUR_CLE manquant dans /srv/recipelog/.env}
      # Sauvegardes : chaque nuit à SAUVEGARDE_HEURE (heure de Paris), test le dimanche.
      TZ: ${TZ:-Europe/Paris}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-3}
      SAUVEGARDE_JOUR_TEST: ${SAUVEGARDE_JOUR_TEST:-0}
      # Surveillance et support (lot 5) : alertes et réponses aux demandes.
      DOMAINE: ${DOMAINE:-recipelog.cc}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-RecipeLog <noreply@recipelog.cc>}
      ALERTE_TELEGRAM_JETON: ${ALERTE_TELEGRAM_JETON:-}
      ALERTE_TELEGRAM_CHAT: ${ALERTE_TELEGRAM_CHAT:-}
      ALERTE_DISCORD_URL: ${ALERTE_DISCORD_URL:-}
      ALERTE_EMAIL: ${ALERTE_EMAIL:-oui}
      # Avec un tunnel Cloudflare : vérifie aussi chaque minute que les sites répondent
      # depuis internet (https://status.<domaine>/sante). « non » pour couper ce contrôle.
      SURVEILLANCE_PUBLIQUE: ${SURVEILLANCE_PUBLIQUE:-${CF_TUNNEL_TOKEN:+oui}}
      # Version donnée aux nouveaux clients (seule « plateforme » existe pour l'instant).
      CANAL_DEFAUT: ${CANAL_DEFAUT:-instance}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Même chemin que sur la machine : recipelog-instance donne ces chemins à Docker.
      - ${DONNEES:-/srv/recipelog}:${DONNEES:-/srv/recipelog}
      # Le dossier (pas le fichier seul) : une mise à jour du dépôt remplace le
      # fichier, et un fichier monté seul resterait sur l'ancienne version.
      - ./bin:/opt/recipelog/bin:ro
    # Pas sur le réseau des clients : seulement joignable par le panel.
    networks: [moteur]

  # Service PDF partagé : un seul Chromium pour tous les clients (plateforme/pdf).
  # Les sites lui envoient leur page prête et reçoivent le PDF (RECIPELOG_PDF_URL,
  # mis par recipelog-instance). Les pages ne peuvent rien charger sur le réseau.
  # Pas de port ouvert, pas d'adresse publique : seuls les sites des clients l'appellent.
  pdf:
    build: ./pdf
    image: recipelog-pdf:local
    container_name: recipelog-pdf
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PDF_MEMOIRE:-1536m}
    pids_limit: 512
    environment:
      PDF_EN_MEME_TEMPS: ${PDF_EN_MEME_TEMPS:-2}
    networks: [recipelog]

  # Site vitrine (lot 4) sur <domaine> et www.<domaine>. Le code vient de la
  # branche site-vitrine : recipelog-instance vitrine maj (ou le panel).
  vitrine:
    image: nginx:1.27-alpine
    container_name: recipelog-vitrine
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./vitrine:/etc/nginx/conf.d:ro
      - ${DONNEES:-/srv/recipelog}/vitrine:/vitrine:ro
    networks: [recipelog]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config.js"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.routers.vitrine.rule: Host(`${DOMAINE:-recipelog.cc}`) || Host(`www.${DOMAINE:-recipelog.cc}`)
      traefik.http.routers.vitrine.entrypoints: web
      traefik.http.routers.vitrine.middlewares: securite@file,limite@file
      traefik.http.services.vitrine.loadbalancer.server.port: "80"

  # Formulaire « Nous écrire » de la vitrine (script de la branche site-vitrine),
  # dans le même réseau que nginx : il n'écoute que sur 127.0.0.1:8090.
  vitrine-contact:
    image: python:3.12-alpine
    container_name: recipelog-vitrine-contact
    restart: unless-stopped
    network_mode: service:vitrine
    depends_on: [vitrine]
    user: "1000:1000"
    read_only: true
    command: ["python3", "/vitrine/code/scripts/vitrine-contact.py"]
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${DONNEES:-/srv/recipelog}/vitrine/code:/vitrine/code:ro
      - ${DONNEES:-/srv/recipelog}/vitrine/reglages:/etc/recipelog-vitrine:ro
      - ${DONNEES:-/srv/recipelog}/vitrine/messages:/var/lib/recipelog-vitrine
