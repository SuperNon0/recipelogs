# Site vitrine sur la plateforme (conteneur recipelog-vitrine, nginx).
# Le code vient de la branche site-vitrine (recipelog-instance vitrine maj),
# rangé dans /srv/recipelog/vitrine/code ; les réglages dans vitrine/reglages.
server {
    listen 80;
    server_name _;
    root /vitrine/code/site;
    index index.html;

    # Adresse du visiteur : donnée par Cloudflare (le tunnel passe par Traefik).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Bandeau réglé depuis le panel : un petit script ajouté en bas de chaque page.
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/bandeau.js" defer></script></body>';

    location = /config.js {
        alias /vitrine/reglages/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /bandeau.js {
        alias /vitrine/reglages/bandeau.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    # Formulaire « Nous écrire » : recipelog-vitrine-contact (même réseau que ce conteneur).
    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 40s;
    }
    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. { deny all; }
}
