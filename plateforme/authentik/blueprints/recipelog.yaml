# Réglages d'Authentik pour RecipeLog, appliqués tout seuls par Authentik au
# démarrage (dossier monté dans /blueprints/custom). Voir ../../connexion.md.
#
# - nom affiché « RecipeLog » ;
# - connexion par email (et non par nom d'utilisateur) ;
# - « Mot de passe oublié ? » : un email avec un lien pour choisir un nouveau
#   mot de passe. Le même email sert d'invitation (lien valable 3 jours) ;
# - groupe « super-admins » : administrateurs d'Authentik, autorisés sur tous
#   les clients (la passerelle les ajoute à chaque application).
version: 1
metadata:
  name: RecipeLog - Réglages
  labels:
    blueprints.goauthentik.io/description: Connexion RecipeLog (email, récupération, super-admins)
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: false

  # ------------------------------------------------ super-admins
  - model: authentik_core.group
    identifiers:
      name: super-admins
    attrs:
      is_superuser: true
      attributes:
        recipelog_role: super-admins

  # ------------------------------------------------ récupération / invitation
  - model: authentik_flows.flow
    id: recuperation
    identifiers:
      slug: recipelog-recuperation
    attrs:
      name: RecipeLog - choisir son mot de passe
      title: Choisis ton mot de passe
      designation: recovery
      authentication: require_unauthenticated

  - model: authentik_stages_prompt.prompt
    id: champ-mdp
    identifiers:
      name: recipelog-recuperation-mdp
    attrs:
      field_key: password
      label: Nouveau mot de passe
      type: password
      required: true
      placeholder: Nouveau mot de passe
      order: 0
      placeholder_expression: false

  - model: authentik_stages_prompt.prompt
    id: champ-mdp-repete
    identifiers:
      name: recipelog-recuperation-mdp-repete
    attrs:
      field_key: password_repeat
      label: Encore une fois
      type: password
      required: true
      placeholder: Le même mot de passe
      order: 1
      placeholder_expression: false

  - model: authentik_policies_password.passwordpolicy
    id: politique-mdp
    identifiers:
      name: recipelog-mot-de-passe
    attrs:
      password_field: password
      length_min: 10
      amount_digits: 0
      amount_lowercase: 0
      amount_uppercase: 0
      amount_symbols: 0
      check_static_rules: true
      check_have_i_been_pwned: false
      check_zxcvbn: false
      error_message: "Le mot de passe doit faire au moins 10 caractères."

  - model: authentik_policies_expression.expressionpolicy
    id: deja-identifie
    identifiers:
      name: recipelog-recuperation-deja-identifie
    attrs:
      expression: |
        return bool(request.context.get('is_restored', True))

  - model: authentik_stages_identification.identificationstage
    id: recup-identification
    identifiers:
      name: recipelog-recuperation-identification
    attrs:
      user_fields: [email]

  - model: authentik_stages_email.emailstage
    id: recup-email
    identifiers:
      name: recipelog-recuperation-email
    attrs:
      use_global_settings: true
      token_expiry: days=3
      subject: "RecipeLog : choisis ton mot de passe"
      template: recipelog-mot-de-passe.html
      activate_user_on_success: true
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5

  - model: authentik_stages_prompt.promptstage
    id: recup-mdp
    identifiers:
      name: recipelog-recuperation-mdp
    attrs:
      fields:
        - !KeyOf champ-mdp
        - !KeyOf champ-mdp-repete
      validation_policies:
        - !KeyOf politique-mdp

  - model: authentik_stages_user_write.userwritestage
    id: recup-ecriture
    identifiers:
      name: recipelog-recuperation-ecriture
    attrs:
      user_creation_mode: never_create

  - model: authentik_stages_user_login.userloginstage
    id: recup-connexion
    identifiers:
      name: recipelog-recuperation-connexion

  - model: authentik_flows.flowstagebinding
    id: lien-identification
    identifiers:
      target: !KeyOf recuperation
      stage: !KeyOf recup-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recuperation
      stage: !KeyOf recup-email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recuperation
      stage: !KeyOf recup-mdp
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recuperation
      stage: !KeyOf recup-ecriture
      order: 40
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf recuperation
      stage: !KeyOf recup-connexion
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  # Lien reçu par email : on saute l'étape « ton adresse ? ».
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf deja-identifie
      target: !KeyOf lien-identification
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  # ------------------------------------------------ déconnexion
  # « Se déconnecter » dans RecipeLog ferme aussi la session Authentik (sinon,
  # sur une tablette partagée, la personne suivante serait reconnectée seule),
  # puis renvoie sur le RecipeLog du client, qui affiche la page de connexion.
  - model: authentik_flows.flow
    id: deconnexion
    identifiers:
      slug: recipelog-deconnexion
    attrs:
      name: RecipeLog - déconnexion
      title: Déconnexion
      designation: invalidation
      authentication: none

  - model: authentik_stages_user_logout.userlogoutstage
    id: etape-deconnexion
    identifiers:
      name: recipelog-deconnexion

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf deconnexion
      stage: !KeyOf etape-deconnexion
      order: 0
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_stages_redirect.redirectstage
    id: etape-retour-appli
    identifiers:
      name: recipelog-deconnexion-retour
    attrs:
      mode: static
      target_static: /
      keep_context: false

  - model: authentik_policies_expression.expressionpolicy
    id: retour-appli
    identifiers:
      name: recipelog-deconnexion-retour-appli
    attrs:
      expression: |
        plan = request.context.get("flow_plan")
        app = plan.context.get("application") if plan else None
        url = app.meta_launch_url if app else ""
        if url:
            plan.context["redirect_stage_target"] = url
        return True

  - model: authentik_flows.flowstagebinding
    id: lien-retour-appli
    identifiers:
      target: !KeyOf deconnexion
      stage: !KeyOf etape-retour-appli
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf retour-appli
      target: !KeyOf lien-retour-appli
      order: 0
    attrs:
      negate: false
      enabled: true
      timeout: 30

  # ------------------------------------------------ connexion
  # Notre propre page de connexion (et non celle d'Authentik, « Welcome to
  # authentik! ») : le blueprint par défaut d'Authentik réécrit la sienne à
  # chaque redémarrage, ce qui faisait revenir son titre et « Courriel ou Nom
  # d'utilisateur ». Adresse email et mot de passe sur le même écran, le lien
  # « Mot de passe oublié ? » et, une fois branché (node cli.mjs google …), le
  # bouton « Google ». Mot de passe, double authentification et ouverture de
  # session : les étapes d'Authentik, réutilisées telles quelles.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: false

  - model: authentik_flows.flow
    id: connexion
    identifiers:
      slug: recipelog-connexion
    attrs:
      name: RecipeLog - connexion
      title: Connexion
      designation: authentication
      authentication: none
      layout: stacked

  - model: authentik_stages_identification.identificationstage
    id: connexion-identification
    identifiers:
      name: recipelog-connexion-identification
    attrs:
      user_fields: [email]
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      recovery_flow: !KeyOf recuperation
      show_source_labels: true
      show_matched_user: false
      pretend_user_exists: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf connexion
      stage: !KeyOf connexion-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf connexion
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf connexion
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false
      policy_engine_mode: any
      invalid_response_action: retry

  # ------------------------------------------------ apparence
  # Nom, icône de l'onglet, page de connexion aux couleurs de RecipeLog (design
  # « encre », accent ambre, clair ou sombre comme l'appareil), en français.
  # Polices et icône : ../theme/, servies par Authentik sous /media/recipelog/.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: RecipeLog
      branding_favicon: /media/recipelog/favicon.svg
      branding_logo: /media/recipelog/favicon.svg
      flow_authentication: !KeyOf connexion
      flow_recovery: !KeyOf recuperation
      attributes:
        settings:
          locale: fr
      branding_custom_css: |
        /* RecipeLog : pages de connexion (auth.<domaine>) au design « encre ».
           Authentik applique ce CSS à chacun de ses composants. Couleurs, polices
           et formes : celles de l'appli RecipeLog (src/encre/encre.css), accent
           « ambre ». Polices et icône : plateforme/authentik/theme/, servies par
           Authentik sous /media/recipelog/ (monté par docker-compose.yml). */

        @font-face { font-family: "Archivo"; src: url("/media/recipelog/archivo-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
        @font-face { font-family: "DM Serif Display"; src: url("/media/recipelog/dm-serif-display-latin.woff2") format("woff2"); font-weight: 400; font-display: swap; }
        @font-face { font-family: "DM Serif Display"; src: url("/media/recipelog/dm-serif-display-italic-latin.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
        @font-face { font-family: "DM Mono"; src: url("/media/recipelog/dm-mono-500-latin.woff2") format("woff2"); font-weight: 500; font-display: swap; }

        /* ------------------------------------------------------------ jetons */
        :root, :host {
          --rl-bg: #0b0f17;
          --rl-surface: #0f1520;
          --rl-card: #141b28;
          --rl-line: #1e2737;
          --rl-line2: #2b3549;
          --rl-text: #e7ebf3;
          --rl-soft: #aab3c5;
          --rl-muted: #8a94aa;
          --rl-accent: #f0a64a;
          --rl-ink: #1a1206;
          --rl-danger: #ef7d6b;
          --rl-ok: #4fc0ad;
          --rl-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
          --rl-title: "DM Serif Display", Georgia, "Times New Roman", serif;
          --rl-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          --rl-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        @media (prefers-color-scheme: light) {
          :root, :host {
            --rl-bg: #f5f3ee;
            --rl-surface: #ffffff;
            --rl-card: #ffffff;
            --rl-line: #e7e2d7;
            --rl-line2: #d5cfc1;
            --rl-text: #1b1d22;
            --rl-soft: #454a55;
            --rl-muted: #666b77;
            --rl-accent: #995400;
            --rl-ink: #ffffff;
            --rl-danger: #bf3f2c;
            --rl-ok: #17725f;
            --rl-shadow: 0 18px 50px rgba(40, 34, 20, 0.16);
          }
        }

        /* Les variables de PatternFly (la base d'Authentik) prennent nos couleurs. */
        :root, :host, :host([theme="dark"]), :host([theme="light"]) {
          --pf-global--FontFamily--sans-serif: var(--rl-body);
          --pf-global--FontFamily--heading--sans-serif: var(--rl-title);
          --pf-global--FontFamily--redhatfont--sans-serif: var(--rl-body);
          --pf-global--FontFamily--redhatfont--heading--sans-serif: var(--rl-title);
          --pf-global--Color--100: var(--rl-text);
          --pf-global--Color--200: var(--rl-soft);
          --pf-global--BackgroundColor--100: var(--rl-card);
          --pf-global--BackgroundColor--200: var(--rl-surface);
          --pf-global--BorderColor--100: var(--rl-line2);
          --pf-global--primary-color--100: var(--rl-accent);
          --pf-global--primary-color--200: var(--rl-accent);
          --pf-global--link--Color: var(--rl-accent);
          --pf-global--link--Color--hover: var(--rl-accent);
          --pf-global--danger-color--100: var(--rl-danger);
          --pf-global--danger-color--200: var(--rl-danger);
          --pf-global--success-color--100: var(--rl-ok);
          --pf-c-login__main--BackgroundColor: var(--rl-card);
          --pf-c-form__label--Color: var(--rl-soft);
          --pf-c-form-control--BackgroundColor: var(--rl-surface);
          --pf-c-form-control--Color: var(--rl-text);
          --pf-c-button--m-primary--BackgroundColor: var(--rl-accent);
          --pf-c-button--m-primary--Color: var(--rl-ink);
          --pf-c-button--m-primary--hover--BackgroundColor: var(--rl-accent);
          --pf-c-button--m-primary--hover--Color: var(--rl-ink);
          --pf-c-button--m-primary--focus--BackgroundColor: var(--rl-accent);
          --pf-c-button--m-primary--focus--Color: var(--rl-ink);
          --pf-c-button--m-primary--active--BackgroundColor: var(--rl-accent);
          --pf-c-button--m-primary--active--Color: var(--rl-ink);
          --ak-dark-background: var(--rl-bg);
          --ak-dark-background-light: var(--rl-card);
          --ak-dark-foreground: var(--rl-text);
          --ak-accent: var(--rl-accent);
          --ak-flow-background: none;
          color-scheme: dark light;
        }

        /* ------------------------------------------------------------ la page */
        /* Le fond : un halo ambre en haut sur l'encre, plus de photo de forêt.
           (Posé sur le cadre de la page de connexion : Authentik 2025.10 abîme ce CSS
           quand il le recopie dans la page elle-même.) */
        .pf-c-background-image { display: none !important; }
        .pf-c-page__drawer {
          min-height: 100vh; min-height: 100dvh;
          background: radial-gradient(70% 50% at 50% 0%, color-mix(in srgb, var(--rl-accent) 16%, transparent), transparent 70%), var(--rl-bg) !important;
          color: var(--rl-text);
        }
        .pf-c-login, .pf-c-drawer, .pf-c-drawer__main, .pf-c-drawer__content, .pf-c-drawer__body { background: transparent !important; }
        .pf-c-login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
        .pf-c-login__container { width: 100%; max-width: 420px; padding: 0; margin: 0 auto; }

        /* La carte de connexion. */
        .pf-c-login__main {
          background: var(--rl-card) !important;
          border: 1px solid var(--rl-line2);
          border-radius: 22px;
          box-shadow: var(--rl-shadow);
          overflow: hidden;
        }

        /* Le nom du site au lieu du logo d'Authentik : la toque, puis « Recipe » et « Log » en italique ambre. */
        .pf-c-login__main-header.pf-c-brand { display: flex; gap: 0; justify-content: center; align-items: center; padding-top: 30px; padding-bottom: 4px; }
        .pf-c-login__main-header.pf-c-brand img { display: none !important; }
        .pf-c-login__main-header.pf-c-brand::before {
          content: "Recipe";
          display: inline-block;
          padding-left: 52px; line-height: 40px; min-height: 40px;
          background: url("/media/recipelog/favicon.svg") left center / 40px 40px no-repeat;
          font: 400 31.5px/40px var(--rl-title);
          color: var(--rl-text);
        }
        .pf-c-login__main-header.pf-c-brand::after {
          content: "Log";
          font: italic 400 31.5px/40px var(--rl-title);
          color: var(--rl-accent);
        }

        /* Titre de l'étape (« Connexion à RecipeLog », « Choisis ton mot de passe »…). */
        .pf-c-login__main-header:not(.pf-c-brand) { text-align: center; padding-top: 10px; }
        .pf-c-title, .pf-c-title.pf-m-3xl, .pf-c-login__main-header h1 {
          font-family: var(--rl-title) !important;
          font-weight: 400 !important;
          font-size: 27px !important;
          line-height: 1.1;
          color: var(--rl-text);
        }
        .pf-c-login__main-header-desc, p { color: var(--rl-soft); }

        /* Champs : 48 px, fond un cran plus bas, bord discret, anneau ambre au focus. */
        .pf-c-form__label, .pf-c-form__label-text { color: var(--rl-soft); font-size: 13.5px; font-weight: 500; }
        .pf-c-form-control, input.pf-c-form-control, select.pf-c-form-control {
          min-height: 48px;
          border-radius: 12px !important;
          border: 1px solid var(--rl-line2) !important;
          background: var(--rl-surface) !important;
          color: var(--rl-text) !important;
          font: 400 16px/1.5 var(--rl-body) !important;
          padding: 0 14px !important;
          transition: border-color .2s, box-shadow .2s;
        }
        .pf-c-form-control:focus, .pf-c-form-control:focus-within {
          border-color: color-mix(in srgb, var(--rl-accent) 45%, transparent) !important;
          box-shadow: 0 0 0 3px color-mix(in srgb, var(--rl-accent) 14%, transparent) !important;
          outline: 0;
        }
        .pf-c-form-control::after, .pf-c-form-control::before { display: none !important; }
        .pf-c-form-control[aria-invalid="true"] { border-color: var(--rl-danger) !important; }
        .pf-c-form__helper-text.pf-m-error, .pf-m-error { color: var(--rl-danger); }

        /* Boutons : 48 px, coins de 10 px, accent plein pour le principal. */
        .pf-c-button {
          min-height: 48px;
          border-radius: 10px !important;
          font: 600 15px/1.2 var(--rl-body) !important;
          transition: transform .15s, filter .15s;
        }
        .pf-c-button::after { border: 0 !important; }
        .pf-c-button:active { transform: scale(.97); }
        .pf-c-button.pf-m-primary { background: var(--rl-accent) !important; color: var(--rl-ink) !important; border: 0 !important; }
        .pf-c-button.pf-m-primary:hover { filter: brightness(1.06); }
        .pf-c-button.pf-m-secondary, .pf-c-button.pf-m-tertiary {
          background: var(--rl-card) !important; color: var(--rl-text) !important;
          border: 1px solid var(--rl-line2) !important;
        }
        .pf-c-button.pf-m-link, a { color: var(--rl-accent); }
        :focus-visible { outline: 2px solid var(--rl-accent); outline-offset: 2px; }

        /* Bas de la carte : « Mot de passe oublié ? », « Google ». */
        .pf-c-login__main-footer-band { background: transparent !important; border-top: 1px solid var(--rl-line); }
        .pf-c-login__main-footer-band-item, .pf-c-login__main-footer-links-item { color: var(--rl-muted); font-size: 13.5px; }

        /* Pas d'astérisque rouge : tous les champs sont obligatoires. */
        .pf-c-form__label-required { display: none !important; }
        .pf-c-form__label[aria-required="true"] .pf-c-form__label-text::after { content: none !important; }
        .pf-c-form__group.pf-m-action { margin-top: 6px; }
        .pf-c-login__main-footer-band { padding-top: 14px !important; padding-bottom: 16px !important; }
        .pf-c-login__main-footer-band-item a, .pf-c-login__main-footer-band-item .pf-c-button { color: var(--rl-soft) !important; font-size: 13.5px !important; min-height: 0; }

        /* Messages d'erreur et d'information. */
        .pf-c-alert { border-radius: 10px; font-family: var(--rl-body); }

        /* Pied de page : pas de « Powered by authentik », seulement nos liens discrets. */
        .pf-c-login__footer, .pf-c-list, .pf-c-list a { color: var(--rl-muted) !important; font: 500 11px/1.4 var(--rl-mono); letter-spacing: .08em; text-transform: uppercase; }
        .pf-c-list li:has(span:only-child) { display: none; }

        /* Téléphone : la carte occupe la largeur, sans coller aux bords. */
        @media (max-width: 600px) {
          .pf-c-login__main { border-radius: 20px; }
          .pf-c-login__main-header.pf-c-brand::before, .pf-c-login__main-header.pf-c-brand::after { font-size: 28px; }
        }

        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; animation: none !important; }
        }

        /* Toute la page en Archivo (Authentik remet sa police par endroits), indications droites. */
        .pf-c-form__label, .pf-c-form__label-text, .pf-c-login__main-footer-band-item, .pf-c-alert, .pf-c-form__helper-text, .pf-c-login__main-body, ak-form-static { font-family: var(--rl-body) !important; }
        .pf-c-form-control::placeholder { font-style: normal !important; color: var(--rl-muted) !important; opacity: 1; }

        /* Erreur (« Échec d'authentification. ») : fond teinté, comme dans l'appli. */
        .pf-c-alert, .pf-c-alert.pf-m-danger, .pf-c-alert.pf-m-inline {
          --pf-c-alert--BoxShadow: none; --pf-c-alert--BorderTopWidth: 0;
          background: color-mix(in srgb, var(--rl-danger) 12%, transparent) !important;
          border: 1px solid color-mix(in srgb, var(--rl-danger) 40%, transparent) !important;
          border-radius: 10px !important; box-shadow: none !important;
        }
        .pf-c-alert::before { display: none !important; }
        .pf-c-alert__title, .pf-c-alert__icon { color: var(--rl-danger) !important; font-weight: 500 !important; }
        .pf-c-login__main { width: 100%; max-width: 420px; margin-left: auto; margin-right: auto; }

        /* Bouton « Google » : un vrai bouton, pleine largeur, sous « Se connecter ». */
        .pf-c-login__main-footer-links { display: grid; gap: 10px; padding: 0 var(--pf-c-login__main-body--PaddingRight, 24px) 20px; margin: 0; }
        .pf-c-login__main-footer-links-item { width: 100%; margin: 0; }
        .pf-c-login__main-footer-links-item .pf-c-button {
          width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
          background: var(--rl-card) !important; color: var(--rl-text) !important;
          border: 1px solid var(--rl-line2) !important;
        }
        .pf-c-login__main-footer-links-item .pf-c-button img, .pf-c-login__main-footer-links-item .pf-c-button svg { width: 20px; height: 20px; }
